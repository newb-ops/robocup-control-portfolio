joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Position Controllers --------------------------------------
neck_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: neck_joint
  pid: {p: 30.0, i: 0.0, d: 2.0}
head_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: head_joint
  pid: {p: 30.0, i: 0.0, d: 2.0}
sho_L_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: sho_L_joint
  pid: {p: 50.0, i: 0.0, d: 1.0}
arm_L_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: arm_L_joint
  pid: {p: 50.0, i: 0.0, d: 2.0}
sho_R_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: sho_R_joint
  pid: {p: 50.0, i: 0.0, d: 1.0}
arm_R_joint_position_controller:
  type: effort_controllers/JointEffortController
  joint: arm_R_joint
  pid: {p: 50.0, i: 0.0, d: 2.0}
