# 노트북에서 RealSense 입력을 확인하는 설정.
robot:
  detector_backend: onnx
  model_path: weights/real_best.onnx   # 저장소에 포함된 실제 카메라용 모델
  conf_thres: 0.40
  img_width: 640
  img_height: 480
  realsense_fps: 30
  realsense_serial: ""
  real_position_enabled: true
  real_depth_min: 0.08
  real_depth_max: 10.0
  camera_height: 1.23
  camera_x: 0.0
  camera_y: 0.0
  camera_pitch_down_deg: 20.0
  use_imu_pitch: true                 # D435i 가속도계를 사용하고, 실패하면 camera_pitch_down_deg를 사용한다.
  use_sysfs_imu_pitch: true
  imu_pitch_alpha: 0.15
  imu_pitch_offset_deg: 0.0
  imu_accel_fps: 0
  localization_enabled: true          # PF 위치추정을 켜고 top-view에 반영한다.
  loc_field_mode: x_pos               # 원점은 하프웨이라인, +x는 골 방향. 전체 필드는 full.
  loc_init_mode: uniform              # 선택한 필드 범위에 균일하게 초기화한다. 우리 진영으로 제한하려면 own_half.
  loc_landmark_classes: ["L","T","X","corner_arc","penalty_mark","goalpost"]  # PF 에 넣을 랜드마크
tuning:
  perception_latency: 0.10              # 거리 보상에 쓰는 인식 지연 가정값 [s]
