# 노트북 + RealSense (실 카메라 검증). 실환경이므로 real 모델 권장.
robot:
  detector_backend: onnx
  model_path: weights/real_best.onnx   # 실환경=real 모델. 파이프라인 스모크테스트만이면 sim_best.pt 도 가능(backend 자동 pt)
  conf_thres: 0.40
  img_width: 640
  img_height: 480
  realsense_fps: 30
  realsense_serial: ""
  real_position_enabled: true
  real_depth_min: 0.08
  real_depth_max: 10.0
  camera_height: 1.23
  camera_x: 0.0
  camera_y: 0.0
  camera_pitch_down_deg: 20.0
  use_imu_pitch: true                 # D435i accel 사용. 실패하면 camera_pitch_down_deg manual fallback
  use_sysfs_imu_pitch: true
  imu_pitch_alpha: 0.15
  imu_pitch_offset_deg: 0.0
  imu_accel_fps: 0
  localization_enabled: true          # 켜야 PF 동작 + top-view 가 origin 고정 안 됨
  loc_field_mode: x_pos               # 그린 절반(원점=하프웨이라인, +x=골 방향). 전체 필드면 full
  loc_init_mode: uniform              # 그 절반 안 어디서 시작하든 수렴. 시작 진영 알면 own_half
  loc_landmark_classes: ["L","T","X","corner_arc","penalty_mark","goalpost"]  # PF 에 넣을 랜드마크
tuning:
  perception_latency: 0.10              # 노트북 CPU 추론이 느릴 수 있어 약간 크게
